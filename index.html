<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Série</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="obrigado.html" method="get">
        <h1>Cadastro de Séries</h1>

        <div class="form-group">
            <label for="nome"><strong>Nome da série:</strong></label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-group">
            <label for="namest"><strong>Streaming onde a série é exibida:</strong></label>
            <input type="text" id="namest" name="namest" placeholder="Exemplo: Netflix" required>
        </div>

        <div class="form-group">
            <label for="autor"><strong>Autor ou Criador:</strong></label>
            <input type="text" id="autor" name="autor" required>
        </div>

        <div class="form-group">
            <label for="temporadas"><strong>Quantidade de temporadas:</strong></label>
            <select id="temporadas" name="temporadas" required>
                <option value="" disabled selected>Selecione...</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="mais_de_10">Mais de 10</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ano"><strong>Ano de criação:</strong></label>
            <input type="number" id="ano" name="ano" required>
        </div>

        <fieldset>
            <legend>Personagens Principais</legend>

            <div class="form-group">
                <label for="personagem1"><strong>1º personagem:</strong></label>
                <input type="text" id="personagem1" name="personagem1" required>
            </div>

            <div class="form-group">
                <label for="personagem2"><strong>2º personagem:</strong></label>
                <input type="text" id="personagem2" name="personagem2" required>
            </div>

            <div class="form-group">
                <label for="personagem3"><strong>3º personagem:</strong></label>
                <input type="text" id="personagem3" name="personagem3" required>
            </div>
        </fieldset>

        <div class="botoes">
            <button type="submit" class="btn-cadastrar">Cadastrar</button>
            <button type="reset" class="btn-limpar">Limpar</button> 
            <button type="button" class="btn-editar">Editar</button>
            <button type="button" class="btn-consultar">Consultar</button>
        </div>
    
    
</form>
</body>
</html>
